name: Build Godot APK
on: [push, workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          GODOT_VER="4.3-stable"
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VER}_linux.x86_64.zip
          mv Godot_v${GODOT_VER}_linux.x86_64 godot && chmod +x godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v${GODOT_VER}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          mkdir -p ~/.config/godot
          cat << EOCONF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOCONF
          sed -i 's|keystore/debug="debug.keystore"|keystore/debug="'"$PWD/debug.keystore"'"|g' export_presets.cfg || true
          ./godot --headless --editor --quit || true
          mkdir -p export_build
          ./godot --headless --export-debug "Android" export_build/TipTop-Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TipTop-Studio-APK
          path: export_build/TipTop-Studio.apk
