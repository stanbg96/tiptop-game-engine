<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Армакедон: NFS Open World Edition</title>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; background: #020205; font-family: sans-serif; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
        #hud { position: absolute; bottom: 25px; left: 25px; background: rgba(10, 10, 20, 0.85); border-left: 4px solid #00f0ff; padding: 15px 20px; border-radius: 0 8px 8px 0; color: white; pointer-events: none; }
        .speedometer { font-size: 32px; font-weight: bold; color: #00f0ff; letter-spacing: 2px; }
        .unit { font-size: 14px; color: #888; margin-left: 5px; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <div id="hud">
        <div id="speed" class="speedometer">0 <span class="unit">KM/H</span></div>
    </div>
    <canvas id="renderCanvas"></canvas>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.02, 0.02, 0.06, 1);
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.5;
            const camera = new BABYLON.FollowCamera("FollowCam", new BABYLON.Vector3(0, 10, -25), scene);
            camera.radius = 14;
            camera.heightOffset = 4.5;

            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 600, height: 600}, scene);
            const groundMat = new BABYLON.StandardMaterial("gMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.08, 0.08, 0.1);
            ground.material = groundMat;

            const buildingMat = new BABYLON.StandardMaterial("bMat", scene);
            buildingMat.diffuseColor = new BABYLON.Color3(0.12, 0.12, 0.18);
            for (let x = -200; x <= 200; x += 40) {
                for (let z = -200; z <= 200; z += 40) {
                    if (Math.abs(x) < 20 || Math.abs(z) < 20) continue;
                    let height = 20 + Math.abs(Math.sin(x * z) * 60);
                    let b = BABYLON.MeshBuilder.CreateBox("b", {width: 28, height: height, depth: 28}, scene);
                    b.position.x = x; b.position.y = height / 2; b.position.z = z;
                    b.material = buildingMat;
                }
            }

            const car = BABYLON.MeshBuilder.CreateBox("car", {width: 2.2, height: 0.9, depth: 4.6}, scene);
            car.position.y = 0.45;
            const carMat = new BABYLON.StandardMaterial("carMat", scene);
            carMat.diffuseColor = new BABYLON.Color3(0.95, 0.1, 0.2);
            car.material = carMat;
            camera.target = car;

            let speed = 0, steering = 0, inputMap = {};
            scene.actionManager = new BABYLON.ActionManager(scene);
            scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, (evt) => { inputMap[evt.sourceEvent.key] = true; }));
            scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, (evt) => { inputMap[evt.sourceEvent.key] = false; }));

            window.addEventListener("pointerdown", (e) => {
                if (e.clientX < window.innerWidth / 2) inputMap["ArrowLeft"] = true;
                else inputMap["ArrowRight"] = true;
                inputMap["ArrowUp"] = true;
            });
            window.addEventListener("pointerup", () => {
                inputMap["ArrowLeft"] = inputMap["ArrowRight"] = inputMap["ArrowUp"] = false;
            });

            scene.registerBeforeRender(() => {
                if (inputMap["w"] || inputMap["W"] || inputMap["ArrowUp"]) speed = Math.min(speed + 0.025, 1.2);
                else if (inputMap["s"] || inputMap["S"] || inputMap["ArrowDown"]) speed = Math.max(speed - 0.025, -0.4);
                else speed *= 0.95;

                let turnFactor = 0.04 * (speed / 1.2);
                if (inputMap["a"] || inputMap["A"] || inputMap["ArrowLeft"]) steering -= turnFactor;
                else if (inputMap["d"] || inputMap["D"] || inputMap["ArrowRight"]) steering += turnFactor;
                else steering *= 0.85;

                car.rotation.y += steering;
                car.moveWithCollisions(new BABYLON.Vector3(Math.sin(car.rotation.y) * speed, 0, Math.cos(car.rotation.y) * speed));
                camera.radius = 14 + (Math.abs(speed) * 4);
                document.getElementById("speed").innerHTML = `${Math.floor(Math.abs(speed) * 160)} <span class="unit">KM/H</span>`;
            });
            return scene;
        };
        const scene = createScene();
        engine.runRenderLoop(() => { scene.render(); });
        window.addEventListener("resize", () => { engine.resize(); });
    </script>
</body>
</html>
